<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心数 · 记录详情</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="clock num">9:41</span>
      <span class="status-icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.6 0 5 1 6.8 2.7l-1.5 1.5A7.7 7.7 0 0 0 8.5 6 7.7 7.7 0 0 0 3.2 6.6L1.7 5.1A9.7 9.7 0 0 1 8.5 2.4Z"/><circle cx="8.5" cy="10.4" r="1.5"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.8" height="4" rx="0.9" fill="currentColor" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <div class="appbar">
      <a class="appbar__btn" href="home.html" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="appbar__title">记录详情</h1>
      <span style="width:40px"></span>
    </div>

    <div class="screen" style="padding-bottom:120px">
      <!-- 主金额（外币记录，展示原始 + 换算） -->
      <div style="text-align:center;padding:12px 20px 24px">
        <span class="txn__icon" style="width:56px;height:56px;margin:0 auto 14px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><path d="M4 8l3-4h10l3 4M9 12h6"/></svg>
        </span>
        <div class="num" style="font-size:42px;font-weight:600;letter-spacing:-.03em">-¥42.30</div>
        <div class="muted" style="font-size:14px;margin-top:4px">星巴克咖啡 · 餐饮 / 咖啡</div>
        <span class="book-type book-type--share" style="margin-top:10px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          支出
        </span>
      </div>

      <!-- 多币种：原始金额 + 换算 -->
      <div class="group" style="margin-top:0">
        <div class="field-row">
          <span class="field-row__label">原始金额</span>
          <span class="field-row__val num">€5.40</span>
        </div>
        <div class="field-row">
          <span class="field-row__label">当日汇率</span>
          <span class="field-row__val"><span class="num">1 EUR ≈ ¥7.83</span></span>
        </div>
        <div class="field-row">
          <span class="field-row__label">换算金额（已固化）</span>
          <span class="field-row__val num">¥42.30</span>
        </div>
      </div>
      <p class="ai-disclaimer" style="text-align:left;padding:0 20px 12px">此笔换算金额在记账当日（6/30）已固定，之后汇率变化不影响历史。汇率仅供记账参考，与银行实际结算可能有差异。</p>

      <!-- 记录信息 -->
      <div class="group">
        <div class="field-row">
          <span class="field-row__label">分类</span>
          <span class="field-row__val">餐饮 · 咖啡</span>
        </div>
        <div class="field-row">
          <span class="field-row__label">日期</span>
          <span class="field-row__val num">2026-06-30 08:12</span>
        </div>
        <div class="field-row">
          <span class="field-row__label">记录人</span>
          <span class="field-row__val"><span class="avatar" style="background:var(--accent)">雨</span>小雨（我）</span>
        </div>
        <div class="field-row">
          <span class="field-row__label">付款人</span>
          <span class="field-row__val"><span class="avatar" style="background:var(--accent)">雨</span>小雨</span>
        </div>
        <div class="field-row">
          <span class="field-row__label">备注</span>
          <span class="field-row__val" style="font-weight:400">通勤路上的拿铁</span>
        </div>
      </div>

      <!-- 图片附件 -->
      <div class="section-label">图片附件</div>
      <div class="photo-strip" style="padding-top:0">
        <div class="photo-thumb" style="width:88px;height:88px"></div>
      </div>
    </div>

    <!-- 权限相关操作（记录人本人 → 可编辑/删除） -->
    <div class="action-bar" style="display:flex;gap:12px">
      <a class="btn btn--ghost" style="flex:1" href="add.html">编辑</a>
      <button class="btn btn--danger" style="flex:1" id="del" aria-live="polite">删除</button>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script>
document.getElementById('del').addEventListener('click', function(){
  if(this.dataset.c){ location.href = 'home.html'; return; }
  this.dataset.c = '1'; this.textContent = '再次点击确认删除';
  var self = this; setTimeout(function(){ if(self.dataset.c){ self.dataset.c=''; self.textContent='删除'; } }, 2500);
});
</script>
</body>
</html>

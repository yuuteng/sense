<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心数 · 账本管理</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="clock num">9:41</span>
      <span class="status-icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.6 0 5 1 6.8 2.7l-1.5 1.5A7.7 7.7 0 0 0 8.5 6 7.7 7.7 0 0 0 3.2 6.6L1.7 5.1A9.7 9.7 0 0 1 8.5 2.4Z"/><circle cx="8.5" cy="10.4" r="1.5"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.8" height="4" rx="0.9" fill="currentColor" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <div class="appbar">
      <a class="appbar__btn" href="home.html" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="appbar__title">账本管理</h1>
      <a class="appbar__btn" href="onboarding.html" aria-label="新建账本">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      </a>
    </div>

    <div class="screen" style="padding-bottom:24px">
      <div class="section-label">我的账本</div>
      <!-- 账本 1：当前 / 默认 -->
      <div class="group" style="margin-top:0">
        <div class="li" style="align-items:flex-start;padding-top:16px;padding-bottom:16px">
          <span class="li__ic" style="width:38px;height:38px;background:var(--accent);color:#fff">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6"/></svg>
          </span>
          <div style="flex:1">
            <div style="font-weight:600;display:flex;align-items:center;gap:8px">家庭日常 <span class="pill" style="background:color-mix(in oklab,var(--accent),transparent 88%);color:var(--accent)">当前 · 默认</span></div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
              <span class="book-type book-type--share">共享可见型</span>
              <span class="role role--owner">我是 Owner</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 账本 2 -->
      <div class="group" style="margin-top:0">
        <a class="li" href="settle.html" style="align-items:flex-start;padding-top:16px;padding-bottom:16px;width:100%;text-align:left;color:var(--fg)">
          <span class="li__ic" style="width:38px;height:38px;background:color-mix(in oklab,var(--warn),transparent 84%);color:color-mix(in oklab,var(--warn),black 30%)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
          </span>
          <div style="flex:1">
            <div style="font-weight:600">日本旅行 2026</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
              <span class="book-type book-type--split">分账结算型</span>
              <span class="role role--admin">我是 Admin</span>
            </div>
          </div>
          <span class="li__val">结算 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg></span>
        </a>
      </div>

      <!-- 成员管理（当前账本） -->
      <div class="section-label">「家庭日常」成员 · 2 人 <a href="#" id="invite">邀请成员</a></div>
      <div class="group" style="margin-top:0">
        <div class="li">
          <span class="avatar" style="background:var(--accent);width:34px;height:34px;font-size:13px">雨</span>
          <div class="li__label">小雨（我）<div class="li__val">创建者</div></div>
          <span class="role role--owner">Owner</span>
        </div>
        <div class="li">
          <span class="avatar" style="background:var(--success);width:34px;height:34px;font-size:13px">哲</span>
          <div class="li__label">阿哲<div class="li__val">2025-11 加入</div></div>
          <button class="role role--admin" id="roleBtn">Admin ⌄</button>
        </div>
      </div>
      <p class="ai-disclaimer" style="text-align:left;padding:0 20px">Owner 可任命/取消 Admin、修改权限、移除成员、解散账本；Admin 可邀请与管理普通成员，但不能移除 Owner 或其他 Admin。</p>

      <!-- 账本操作 -->
      <div class="group">
        <button class="li" style="width:100%;text-align:left">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
          <span class="li__label">编辑账本信息</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg>
        </button>
        <button class="li" style="width:100%;text-align:left" onclick="location.href='settings.html'">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
          <span class="li__label">管理分类</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg>
        </button>
        <button class="li" style="width:100%;text-align:left;color:var(--danger)" id="dissolve">
          <span class="li__ic" style="background:color-mix(in oklab,var(--danger),transparent 90%);color:var(--danger)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></span>
          <span class="li__label" style="color:var(--danger)">解散账本</span>
        </button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script>
  document.getElementById('invite').addEventListener('click', function(e){ e.preventDefault(); this.textContent = '已生成微信邀请 ✓'; });
  document.getElementById('roleBtn').addEventListener('click', function(){
    this.textContent = this.textContent.indexOf('Admin')>-1 ? '读写 ⌄' : 'Admin ⌄';
    this.className = this.className.indexOf('admin')>-1 ? 'role role--rw' : 'role role--admin';
  });
  document.getElementById('dissolve').addEventListener('click', function(){
    if(this.dataset.c){ this.querySelector('.li__label').textContent='已解散（原型示意）'; return; }
    this.dataset.c='1'; this.querySelector('.li__label').textContent='此操作不可恢复 · 再次点击确认';
    var self=this; setTimeout(function(){ if(self.dataset.c){ self.dataset.c=''; self.querySelector('.li__label').textContent='解散账本'; } },2500);
  });
</script>
</body>
</html>

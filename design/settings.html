<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心数 · 我的</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="clock num">9:41</span>
      <span class="status-icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.6 0 5 1 6.8 2.7l-1.5 1.5A7.7 7.7 0 0 0 8.5 6 7.7 7.7 0 0 0 3.2 6.6L1.7 5.1A9.7 9.7 0 0 1 8.5 2.4Z"/><circle cx="8.5" cy="10.4" r="1.5"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.8" height="4" rx="0.9" fill="currentColor" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <div class="appbar"><h1 class="appbar__title">我的</h1></div>

    <div class="screen screen--pad">
      <!-- 个人头 -->
      <div class="li" style="margin:0 20px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px">
        <span class="avatar" style="background:var(--accent);width:48px;height:48px;font-size:18px">雨</span>
        <div class="li__label">小雨<div class="li__val">已加入 2 个账本 · 默认「家庭日常」</div></div>
      </div>

      <div class="group__title">偏好</div>
      <div class="group" style="margin-top:0">
        <button class="li" style="width:100%;text-align:left" id="curBtn">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5c.5-1.5 4-2 4 0 0 1.5-2 1.5-2 3M12 16h.01"/></svg></span>
          <span class="li__label">展示币种</span>
          <span class="li__val" id="curVal">¥ CNY ⌄</span>
        </button>
        <button class="li" style="width:100%;text-align:left">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
          <span class="li__label">分类管理</span>
          <span class="li__val">家庭日常 <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg></span>
        </button>
        <div class="li">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v10H9l-4 3v-3H4z"/></svg></span>
          <span class="li__label">AI 会话保留上限</span>
          <span class="li__val num">50 条</span>
        </div>
      </div>

      <div class="group__title">账本与数据</div>
      <div class="group" style="margin-top:0">
        <a class="li" href="books.html">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6"/></svg></span>
          <span class="li__label" style="color:var(--fg)">账本管理</span>
          <span class="li__val">2 个 <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg></span>
        </a>
        <button class="li" style="width:100%;text-align:left" id="exportBtn">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg></span>
          <span class="li__label">导出数据</span>
          <span class="li__val">JSON / Excel / PDF</span>
        </button>
        <button class="li" style="width:100%;text-align:left" id="importBtn">
          <span class="li__ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 21h14"/></svg></span>
          <span class="li__label">导入数据</span>
          <span class="li__val">JSON / Excel</span>
        </button>
      </div>

      <div class="group__title">关于</div>
      <div class="group" style="margin-top:0">
        <div class="li"><span class="li__label">隐私说明</span><span class="li__val">AI 分析基于你的账本数据</span></div>
        <div class="li"><span class="li__label">版本</span><span class="li__val num">v1.0 · P1</span></div>
      </div>
    </div>

    <nav class="tabbar">
      <a class="tabbar__item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>首页
      </a>
      <a class="tabbar__item" href="stats.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20v-6M12 20V5M19 20v-9" stroke-linecap="round"/><path d="M3 20h18" stroke-linecap="round"/></svg>统计
      </a>
      <a class="tabbar__item" href="ai.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v10H9l-4 3v-3H4z" stroke-linejoin="round"/><path d="M12 8l.7 1.8L14.5 10l-1.8.7L12 12l-.7-1.3L9.5 10l1.8-.2z" fill="currentColor" stroke="none"/></svg>AI 助手
      </a>
      <a class="tabbar__item" href="settings.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>我的
      </a>
    </nav>
    <div class="home-indicator"></div>
  </div>
</div>

<script>
  var curs = ['¥ CNY','€ EUR','$ USD']; var ci = 0;
  document.getElementById('curBtn').addEventListener('click', function(){
    ci = (ci+1)%curs.length; document.getElementById('curVal').textContent = curs[ci]+' ⌄';
  });
  document.getElementById('exportBtn').addEventListener('click', function(){
    this.querySelector('.li__val').textContent = '已导出 214 条 ✓';
  });
  document.getElementById('importBtn').addEventListener('click', function(){
    this.querySelector('.li__val').textContent = '成功 30 · 失败 0';
  });
</script>
</body>
</html>
